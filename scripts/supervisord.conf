[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:mysql]
command=/usr/sbin/mysqld --user=mysql --datadir=/app/data/mysql --bind-address=0.0.0.0
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/mysql.log
stderr_logfile=/app/data/logs/mysql-error.log
priority=10

[program:embedding]
command=python3 /app/embedding/embedding_server.py
directory=/app/embedding
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/embedding.log
stderr_logfile=/app/data/logs/embedding-error.log
priority=20
environment=HF_ENDPOINT="%(ENV_HF_ENDPOINT)s",EMBEDDING_MODEL="%(ENV_EMBEDDING_MODEL)s"

[program:backend]
command=java -Djava.security.egd=file:/dev/./urandom -jar /app/backend/app.jar
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/backend.log
stderr_logfile=/app/data/logs/backend-error.log
priority=30
environment=LUBAN_JWT_SECRET="%(ENV_LUBAN_JWT_SECRET)s",LUBAN_DATASOURCE_SECRET="%(ENV_LUBAN_DATASOURCE_SECRET)s",LUBAN_RSA_PRIVATE_KEY="%(ENV_LUBAN_RSA_PRIVATE_KEY)s",SPRING_DATASOURCE_URL="%(ENV_SPRING_DATASOURCE_URL)s",SPRING_DATASOURCE_USERNAME="%(ENV_SPRING_DATASOURCE_USERNAME)s",SPRING_DATASOURCE_PASSWORD="%(ENV_SPRING_DATASOURCE_PASSWORD)s",LUBAN_EMBEDDING_BASE_URL="%(ENV_LUBAN_EMBEDDING_BASE_URL)s"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/nginx.log
stderr_logfile=/app/data/logs/nginx-error.log
priority=40