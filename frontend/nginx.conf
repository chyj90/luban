# This file is the HTTP-only fallback for the standalone frontend container.
# When TLS certs are mounted at /etc/nginx/ssl/tls.crt + tls.key,
# the entrypoint script generates an enhanced config with HTTPS.
# If no certs are present, this file is used as-is (HTTP only).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        # Agent 附件上传（Word/TXT/Excel）走 multipart，与后端 50MB 上限对齐；
        # nginx 默认 1MB 会导致大文件 413
        client_max_body_size 50m;
    }
}