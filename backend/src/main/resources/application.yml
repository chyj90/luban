server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/luban?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: cyj2625130
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  security:
    debug: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  security:
    jwt:
      # 生产必须通过环境变量 LUBAN_JWT_SECRET 注入 256 位以上密钥；
      # 未注入时启动会使用随机临时密钥（每次重启所有登录态失效）
      secret: ${LUBAN_JWT_SECRET:}
      expiration: 86400000
    # 传输层信封加密私钥：默认指向本地 PEM 文件（backend/config/rsa-private.pem，已 gitignore）；
    # 生产可用环境变量 LUBAN_RSA_PRIVATE_KEY 直接注入 PEM 内容或 file: 路径
    rsa:
      private-key: ${LUBAN_RSA_PRIVATE_KEY:file:config/rsa-private.pem}
    api-key-enabled: true

luban:
  mock-mes:
    enabled: true
  agent:
    rate-limit:
      max-requests: 30
      window-minutes: 1
  algorithms:
    storage-path: algorithms
  drivers:
    storage-path: drivers
    auto-load-on-startup: true
    maven:
      repo-url: https://maven.aliyun.com/repository/central
      fallback-url: https://repo.huaweicloud.com/repository/maven/
      connect-timeout: 10000
      read-timeout: 30000
      max-retries: 3
  datasource:
    secret: ${LUBAN_DATASOURCE_SECRET:s5NHFCgkA7ju+WVrOFtZzG/0SQZRnaMggynl9q9fze4=}