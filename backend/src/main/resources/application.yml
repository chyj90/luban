server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/luban?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: cyj2625130
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  security:
    debug: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  security:
    jwt:
      # 生产必须通过环境变量 LUBAN_JWT_SECRET 注入 256 位以上密钥；
      # 未注入时启动会使用随机临时密钥（每次重启所有登录态失效）
      secret: ${LUBAN_JWT_SECRET:}
      expiration: 86400000
    # 传输层信封加密私钥：默认指向本地 PEM 文件（backend/config/rsa-private.pem，已 gitignore）；
    # 生产可用环境变量 LUBAN_RSA_PRIVATE_KEY 直接注入 PEM 内容或 file: 路径
    rsa:
      private-key: ${LUBAN_RSA_PRIVATE_KEY:file:config/rsa-private.pem}
    api-key-enabled: true

luban:
  mock-mes:
    enabled: true
  sandbox:
    # 编排 python 节点与附件解析代码共用的沙箱服务；compose 里经 LUBAN_EMBEDDING_BASE_URL 指向 embedding 容器
    base-url: ${LUBAN_EMBEDDING_BASE_URL:http://127.0.0.1:8765}
  file:
    # Agent 附件文件存储目录（Word/TXT/Excel），Docker 部署必须挂 volume 持久化；
    # embedding-service 需挂同一卷（LUBAN_FILES_ROOT）才能把文件绑定进沙箱
    storage-dir: ${LUBAN_FILE_STORAGE_DIR:./luban-files}
  agent:
    rate-limit:
      max-requests: 30
      window-minutes: 1
  algorithms:
    storage-path: algorithms
  drivers:
    storage-path: drivers
    auto-load-on-startup: true
    maven:
      repo-url: https://maven.aliyun.com/repository/central
      fallback-url: https://repo.huaweicloud.com/repository/maven/
      connect-timeout: 10000
      read-timeout: 30000
      max-retries: 3
  datasource:
    secret: ${LUBAN_DATASOURCE_SECRET:s5NHFCgkA7ju+WVrOFtZzG/0SQZRnaMggynl9q9fze4=}

# 工作流引擎
workflow:
  form-validation:
    # 发起数据契约校验：formData 按绑定表单 schema 校验必填与类型，
    # 缺字段发起即报错（此前漏传只在审批回写时静默断链）。存量应用迁移期可置 false 关闭
    enabled: true