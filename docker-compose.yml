version: '3.8'

services:
  # ============================================================
  # MySQL 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: luban-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luban123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luban}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 可选：自动初始化 SQL 脚本
      # - ./backend/sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-luban123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - luban-net

  # ============================================================
  # Embedding 向量服务 (Python)
  # ============================================================
  embedding:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: luban-embedding
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "${EMBEDDING_PORT:-8765}:8765"
    volumes:
      # 持久化模型缓存，避免重启重新下载
      - embedding_cache:/root/.cache
    networks:
      - luban-net
    restart: unless-stopped

  # ============================================================
  # Java 后端 (Spring Boot)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luban-backend
    depends_on:
      mysql:
        condition: service_healthy
      embedding:
        condition: service_started
    environment:
      # 数据库连接
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-luban}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-luban123}
      # JWT / 安全密钥（自动生成，也可通过环境变量注入固定值）
      - LUBAN_JWT_SECRET=${LUBAN_JWT_SECRET:-}
      - LUBAN_DATASOURCE_SECRET=${LUBAN_DATASOURCE_SECRET:-}
      - LUBAN_RSA_PRIVATE_KEY=${LUBAN_RSA_PRIVATE_KEY:-}
      # Embedding 服务地址
      - LUBAN_EMBEDDING_BASE_URL=http://embedding:8765
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_logs:/app/logs
      - backend_algorithms:/app/algorithms
    networks:
      - luban-net
    restart: unless-stopped

  # ============================================================
  # 前端 (Vite + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luban-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - luban-net
    restart: unless-stopped

volumes:
  mysql_data:
  embedding_cache:
  backend_logs:
  backend_algorithms:

networks:
  luban-net:
    driver: bridge